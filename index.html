<!-- Feedback Count Display -->
<div id="feedback-count" style="font-size: 1.2rem; font-weight: bold; margin: 10px 0;">
  Feedback received: <span id="count">0</span>
</div>

<script>
  // Unique key for your project
  const COUNTER_KEY = "croupguard-feedback";

  // Load the current count when the page opens
  async function loadCount() {
    try {
      const res = await fetch(`https://api.countapi.xyz/get/${COUNTER_KEY}`);
      const data = await res.json();
      document.getElementById("count").innerText = data.value || 0;
    } catch (err) {
      console.log("Could not load count");
    }
  }

  // When someone submits feedback
  async function submitFeedback() {
    const message = document.getElementById("feedback-input")?.value?.trim();
    
    if (!message) {
      alert("Please write something before submitting.");
      return;
    }

    try {
      // Increase the public count by 1
      const res = await fetch(`https://api.countapi.xyz/hit/${COUNTER_KEY}`);
      const data = await res.json();
      document.getElementById("count").innerText = data.value;

      // Clear the input
      if (document.getElementById("feedback-input")) {
        document.getElementById("feedback-input").value = "";
      }

      alert("Thank you for your feedback!");
    } catch (err) {
      alert("Something went wrong. Please try again.");
    }
  }

  // Load the count as soon as the page opens
  loadCount();
</script>
